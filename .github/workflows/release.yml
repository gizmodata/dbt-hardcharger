name: release

# On a vX.Y.Z tag: every CI job on the tagged commit (ci.yml: the README install, lint and
# type checks, the full test suite on Python 3.11 to 3.14 and on the lowest dependencies),
# then the wheel and sdist, PyPI through trusted publishing (the `pypi` environment:
# no token, the workflow's OIDC identity), and a GitHub
# Release with the tag's CHANGELOG.md section as its notes and the artifacts attached.
#
# The package depends on adbc-driver-hardcharger at the floor pyproject.toml names. The build
# refuses to go on while PyPI has no such version, so a release can never publish a package
# nobody can install. CI builds the driver from a pinned commit of gizmodata/hardcharger-adbc
# (.github/hardcharger-adbc.ref): that is CI plumbing only, and the build checks
# that the wheel's metadata carries the plain floor, never a git pin.
#
# workflow_dispatch runs the tests and the build only: publishing needs a tag.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# Its own group: ci.yml, called below, takes "ci-<caller's name>-<ref>". A tag's release is
# never cancelled halfway.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  tests:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      packages: read  # the server image the suites run against
    secrets: inherit  # any secret ci.yml comes to use

  build:
    needs: tests
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - id: version
        name: The tag matches the version everywhere, and CHANGELOG.md has its section
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          [ -n "$version" ] || { echo "::error::no version in pyproject.toml"; exit 1; }
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME != v$version"; exit 1; }
          fi
          grep -qx "__version__ = \"$version\"" dbt/adapters/hardcharger/__init__.py || { echo "::error::__init__.py is not $version"; exit 1; }
          grep -qx "version = \"$version\"" dbt/adapters/hardcharger/__version__.py || { echo "::error::__version__.py is not $version"; exit 1; }
          grep -qx "version: $version" dbt/include/hardcharger/dbt_project.yml || { echo "::error::dbt_project.yml is not $version"; exit 1; }
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "::error::no CHANGELOG.md section for $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - id: floor
        name: The driver this package depends on is on PyPI
        run: |
          set -euo pipefail
          floor=$(sed -n 's/^ *"adbc-driver-hardcharger>=\([^",]*\)".*/\1/p' pyproject.toml)
          [ -n "$floor" ] || { echo "::error::no adbc-driver-hardcharger floor in pyproject.toml"; exit 1; }
          echo "adbc-driver-hardcharger>=$floor"
          code=$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 "https://pypi.org/pypi/adbc-driver-hardcharger/$floor/json")
          [ "$code" = 200 ] || { echo "::error::adbc-driver-hardcharger $floor is not on PyPI (HTTP $code): publish the driver first, or raise the floor to a published version"; exit 1; }
          echo "floor=$floor" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Build the wheel and sdist
        run: |
          python -m pip install -q build twine
          python -m build --sdist --wheel --outdir dist .
          python -m twine check --strict dist/*
          ls dist
      - name: The wheel depends on the driver by its PyPI floor, not a git pin
        env:
          FLOOR: ${{ steps.floor.outputs.floor }}
        run: |
          set -euo pipefail
          python - "$FLOOR" <<'PY'
          import glob, sys, zipfile
          floor = sys.argv[1]
          (wheel,) = glob.glob("dist/*.whl")
          with zipfile.ZipFile(wheel) as z:
              (meta,) = [n for n in z.namelist() if n.endswith("/METADATA")]
              lines = z.read(meta).decode().splitlines()
          deps = [l for l in lines if l.startswith("Requires-Dist: adbc-driver-hardcharger")]
          print("\n".join(deps))
          if deps != [f"Requires-Dist: adbc-driver-hardcharger>={floor}"]:
              sys.exit("::error::the wheel's adbc-driver-hardcharger dependency is not the plain PyPI floor")
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/dbt-hardcharger
    permissions:
      id-token: write  # trusted publishing: PyPI's publisher names this repo, this file and the `pypi` environment
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
      - name: Confirm PyPI serves the new version
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          for _ in $(seq 1 30); do
            curl -fsS "https://pypi.org/pypi/dbt-hardcharger/$VERSION/json" >/dev/null && exit 0
            sleep 10
          done
          echo "::error::PyPI doesn't list dbt-hardcharger $VERSION"; exit 1

  release:
    needs: [build, pypi]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Release notes from CHANGELOG.md
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            index($0, "## [" ver "]") == 1 { p = 1; next }
            p && /^## \[/ { exit }
            p { print }
          ' CHANGELOG.md > release-notes.md
          [ -s release-notes.md ] || { echo "::error::the CHANGELOG.md section for $version is empty"; exit 1; }
      - uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          files: dist/*
